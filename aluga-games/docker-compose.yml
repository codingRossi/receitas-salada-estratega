services:
  postgres:
    image: postgres:16-alpine
    container_name: alugagames_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: alugagames
      POSTGRES_PASSWORD: alugagames_dev_password
      POSTGRES_DB: alugagames
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - alugagames_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alugagames -d alugagames"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: alugagames_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: alugagames
      MINIO_ROOT_PASSWORD: alugagames_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - alugagames_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-create-bucket:
    image: minio/mc:latest
    container_name: alugagames_minio_create_bucket
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 alugagames alugagames_dev_password; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb local/alugagames-media --ignore-existing;
      mc anonymous set download local/alugagames-media;
      exit 0;
      "

volumes:
  alugagames_postgres_data:
  alugagames_minio_data:
